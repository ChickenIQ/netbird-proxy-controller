apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: NETBIRD_URL
              value: {{ .Values.netbird.url | quote }}
            - name: NETBIRD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.netbird.secret.name }}
                  key: {{ .Values.netbird.secret.key }}
            - name: PROXY_IMAGE
              value: {{ .Values.proxy.image | quote }}
            - name: PROXY_REPLICAS
              value: {{ .Values.proxy.replicas | quote }}
            - name: PROXY_SERVICE_LABELS
              value: {{ .Values.proxy.service.labels | toJson | quote }}
            - name: PROXY_SERVICE_ANNOTATIONS
              value: {{ .Values.proxy.service.annotations | toJson | quote }}
            - name: PROXY_DOMAIN
              value: {{ required "proxy.domain is required" .Values.proxy.domain | quote }}
